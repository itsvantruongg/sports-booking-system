<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Kinetic</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e1e1ef",
                        "tertiary-fixed": "#9cf0ff",
                        "on-secondary-fixed": "#002108",
                        "on-primary-container": "#dfe3ff",
                        "primary": "#003ec7",
                        "on-secondary-fixed-variant": "#00531e",
                        "on-surface-variant": "#434656",
                        "inverse-surface": "#2e303a",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#001452",
                        "surface-bright": "#fbf8ff",
                        "surface-container-low": "#f3f2ff",
                        "primary-container": "#0052ff",
                        "on-secondary": "#ffffff",
                        "outline": "#737688",
                        "inverse-primary": "#b7c4ff",
                        "surface-tint": "#004ced",
                        "background": "#fbf8ff",
                        "on-surface": "#191b25",
                        "tertiary-container": "#00717e",
                        "primary-fixed": "#dde1ff",
                        "secondary": "#006e2a",
                        "on-secondary-container": "#00732c",
                        "surface-container": "#ededfb",
                        "on-primary-fixed-variant": "#0038b6",
                        "on-background": "#191b25",
                        "on-tertiary-fixed-variant": "#004f58",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#a7f1ff",
                        "on-error": "#ffffff",
                        "surface-container-high": "#e7e7f5",
                        "secondary-fixed": "#69ff87",
                        "on-tertiary-fixed": "#001f24",
                        "secondary-fixed-dim": "#3ce36a",
                        "outline-variant": "#c3c5d9",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e1e1ef",
                        "tertiary": "#005761",
                        "surface": "#fbf8ff",
                        "surface-dim": "#d9d9e7",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f0effe",
                        "error": "#ba1a1a",
                        "secondary-container": "#5cfd80",
                        "primary-fixed-dim": "#b7c4ff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#00daf3"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline, .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Background Image / Decorative Element -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-1/2 -right-1/4 w-[120vw] h-[1228px] bg-gradient-to-br from-primary/5 to-secondary/5 rounded-full blur-[100px] opacity-70"></div>
<img alt="Background" class="w-full h-full object-cover opacity-10 mix-blend-overlay" data-alt="abstract architectural lines in vibrant blue and deep green tones with dynamic shadows creating a sense of movement" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwviQL5eH5KLB6DXRSN-buIy3oiUY1nnVNftLzIQy3lD8ZIDRGB3ZXN32mUKVkptOAqPbeFBNvOqdZnNC1iSE5BkXLEvgneGMt1tkP4ptjkhdgzgAmOjS9IPRzU3p96yh3CRVuByUyfan-zIKRydxHsbS2EgcCsfSwF8oWSYlevdePCHJsl-oU3c2SrUHKEPK4Ywl5pctr7zinE03X9WZUFPxB8cvK8roG89XIZ4ShHFWz1lPKKP9hq9_RPjv8cZS3tMeHZxgF-ds"/>
</div>
<!-- Main Registration Card -->
<div class="relative z-10 w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-[0_12px_60px_rgba(25,27,37,0.06)] overflow-hidden flex flex-col md:flex-row">
<!-- Left Side: Branding / Image (Hidden on small screens) -->
<div class="hidden md:block md:w-2/5 relative bg-surface-container-low overflow-hidden">
<img alt="Athlete Preparation" class="absolute inset-0 w-full h-full object-cover" data-alt="athlete lacing up shoes on a pristine indoor court under bright dramatic lighting, emphasizing preparation and focus" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDoHNHwPO9PIV5B_jpO6WczAklpPJR6JLLypZU6pW14W_-D6VhBAC-HZm4Gq_iuinCvNutE1CiBKvN7dj4lhoXCtWCrBmfImaW7RTobIR4Uj8__093ds50FtYgWnAmekh62JDwroe3Qxp9ANePUd5KuY85mzd_5puDUyFbgCYreiZ29KTtddYudcg0JAjj8s7DaLy9p2SkC9gMH0o6Ri3u9kynFtPCntOykEKW5MNDs1FWt4_QtpsoMsZFtqHmDZFexhP_bxfZsoOk"/>
<div class="absolute inset-0 bg-gradient-to-t from-on-primary-fixed/80 to-transparent"></div>
<div class="absolute bottom-0 left-0 p-8 w-full">
<span class="font-headline font-black text-3xl tracking-tighter text-on-primary mb-2 block">KINETIC</span>
<p class="font-body text-inverse-primary text-sm">Join the elite. Elevate your game today.</p>
</div>
</div>
<!-- Right Side: Form -->
<div class="w-full md:w-3/5 p-8 md:p-12 bg-surface-container-lowest">
<div class="mb-8">
<h1 class="font-display font-bold text-3xl tracking-tight text-on-surface mb-2">Create Account</h1>
<p class="font-body text-on-surface-variant text-base">Enter your details to get started.</p>
</div>
<form action="#" class="space-y-5" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label text-sm font-medium text-on-surface mb-1" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-surface rounded-DEFAULT border-none text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-bright transition-colors font-body text-base outline-none shadow-[inset_0_0_0_1px_rgba(195,197,217,0.3)] focus:shadow-none" id="fullName" name="fullName" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label text-sm font-medium text-on-surface mb-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-surface rounded-DEFAULT border-none text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-bright transition-colors font-body text-base outline-none shadow-[inset_0_0_0_1px_rgba(195,197,217,0.3)] focus:shadow-none" id="email" name="email" placeholder="john@example.com" type="email"/>
</div>
</div>
<!-- Phone -->
<div>
<label class="block font-label text-sm font-medium text-on-surface mb-1" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">phone</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-surface rounded-DEFAULT border-none text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-bright transition-colors font-body text-base outline-none shadow-[inset_0_0_0_1px_rgba(195,197,217,0.3)] focus:shadow-none" id="phone" name="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label text-sm font-medium text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full pl-11 pr-11 py-3 bg-surface rounded-DEFAULT border-none text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-bright transition-colors font-body text-base outline-none shadow-[inset_0_0_0_1px_rgba(195,197,217,0.3)] focus:shadow-none" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</div>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label text-sm font-medium text-on-surface mb-1" for="confirmPassword">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock_reset</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-surface rounded-DEFAULT border-none text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-bright transition-colors font-body text-base outline-none shadow-[inset_0_0_0_1px_rgba(195,197,217,0.3)] focus:shadow-none" id="confirmPassword" name="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms -->
<div class="flex items-start mt-4">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface outline-none cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body text-on-surface-variant cursor-pointer" for="terms">
                            I agree to the <a class="text-primary hover:text-primary-container font-medium hover:underline transition-colors" href="#">Terms &amp; Conditions</a> and <a class="text-primary hover:text-primary-container font-medium hover:underline transition-colors" href="#">Privacy Policy</a>.
                        </label>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary hover:bg-gradient-to-br hover:from-primary hover:to-primary-container font-headline font-bold text-lg py-4 px-6 rounded-full flex items-center justify-center gap-2 transition-all duration-300 shadow-[0_8px_20px_rgba(0,62,199,0.2)] hover:shadow-[0_12px_24px_rgba(0,62,199,0.3)] hover:-translate-y-0.5 active:translate-y-0 active:shadow-none" type="button">
                        Sign Up
                        <span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="font-body text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:text-primary-container hover:underline transition-colors" href="#">Login</a>
</p>
</div>
</div>
</div>
</body></html>
